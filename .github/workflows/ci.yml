name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run prettier:check
      - run: npm run emulators:start
      - name: Wait for emulators
        run: |
          for port in 9090 10000 4443; do
            timeout 60 bash -c "until nc -z localhost $port; do sleep 1; done"
          done
      # Runs every provider suite (local, S3, Azure, Google Cloud) against the emulators.
      - run: npm run test:emulators
